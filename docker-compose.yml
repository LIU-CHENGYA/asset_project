services:
  db:
    image: postgres:15-alpine
    container_name: fastapi_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # 確保資料不會因為容器重啟而消失
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # 關鍵：讓 Docker 檢查 PostgreSQL 是否真的準備好接受連線
      test: ["CMD","pg_isready", "-U", "myuser", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: backend.dockerfile
    container_name: fastapi_web_app
    ports:
      - "8000:8000"
    volumes:
      # 掛載程式碼進行本地開發（即時同步變動）
      - .:/app
      # 保護容器內的 Linux .venv 虛擬環境，不被本機覆蓋
      - /app/.venv
    environment:
      - ENV=development
      # 資料庫連線字串，主機名直接寫 db (Docker 內部的 DNS 會自動解析)
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - PYTHONDONTWRITEBYTECODE=1
    # 啟動命令：啟用 FastAPI (uvicorn) 的 --reload 即時重載功能
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        # 關鍵：確保 db 的 healthcheck 通過後，web 才會啟動
        condition: service_healthy

volumes:
  postgres_data:



